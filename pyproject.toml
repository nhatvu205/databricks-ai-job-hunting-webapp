[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-hunting-copilot"
version = "0.1.1"
description = "Databricks capstone: job-search RAG, Lakebase actions, and an MCP server"
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk>=0.65.0",
  "fastmcp>=2.10.0",
  "httpx>=0.27.0",
  "openai>=1.70.0",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "streamlit>=1.43.0",
]

[project.scripts]
ingest_remoteok = "job_copilot.pipeline_job:main"

[project.optional-dependencies]
pipeline = ["pyspark>=3.5.0"]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
